# Local Postgres for the analytics service (events_db). Separate from the
# betterapply database on purpose; host port 5433 so both can run side by side.
services:
  events-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-events_db}
    volumes:
      - events_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-events_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"

volumes:
  events_pgdata:
